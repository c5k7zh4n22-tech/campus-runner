services:
  campus-runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: campus-runner:latest
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
